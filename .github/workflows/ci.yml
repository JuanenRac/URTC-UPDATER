name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Install Qt runtime libraries for the headless window tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Validate Updater manifest, discovery, install flow and the Qt bridge (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps .
          PYTHONPATH=src python -m pytest tests -q --cov=src --cov-fail-under=71
      - name: Simulated GitHub - install, update and rollback against a local fake remote
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=src python -m pytest tests/test_install.py tests/test_install_refusals.py tests/test_backups.py tests/test_commits.py tests/test_github_client.py tests/test_github_fetch_errors.py tests/test_security.py -q
      - name: Type check
        run: python -m mypy
  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the tests (renames, read-only files and .bat build scripts behave differently on Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps .
          python -m pytest tests -q
